<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cobrança – Fucape</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
:root{--red:#E52329;--red-dk:#9C1E21;--amber:#C9821A;--ok:#2E7D4F;--purple:#7A3E9D;--grey:#8A8A8A;
  --bg:#F6F6F7;--panel:#FFFFFF;--line:#E3E3E6;--fg:#1F1F22;--muted:#6B6B72;--col:#EEEEF0;--shadow:0 1px 2px rgba(20,20,30,.06),0 2px 8px rgba(20,20,30,.04);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171A;--panel:#222226;--line:#34343A;--fg:#EDEDF0;--muted:#A0A0A8;--col:#1C1C20;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17171A;--panel:#222226;--line:#34343A;--fg:#EDEDF0;--muted:#A0A0A8;--col:#1C1C20;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;font-size:14px;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.top{display:flex;align-items:stretch;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.bars{display:flex}.bars i{display:block;width:8px;background:var(--red-dk)}.bars i+i{width:20px;background:var(--red)}
.topin{flex:1;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding:10px 18px}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-size:17px;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.views{display:flex;gap:2px;background:var(--bg);padding:3px;border-radius:9px}
.views button{border:none;background:none;padding:7px 14px;border-radius:7px;cursor:pointer;font-weight:700;color:var(--muted)}
.views button[aria-pressed=true]{background:var(--panel);color:var(--red);box-shadow:var(--shadow)}
.me{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.av{width:26px;height:26px;border-radius:50%;flex:none;object-fit:cover;background:var(--line)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 18px;flex:none}
.filters input[type=search],.filters select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);min-width:0}
.filters input[type=search]{width:min(100%,260px)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px;cursor:pointer;font-size:13px}
.seg button[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.note{color:var(--muted);font-size:12px}
.banner{margin:0 18px 8px;padding:8px 12px;border-radius:8px;background:color-mix(in srgb,var(--amber) 12%,var(--panel));border:1px solid var(--amber);font-size:13px}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.board{flex:1;min-height:0;display:flex;gap:12px;overflow-x:auto;padding:4px 18px 18px;align-items:stretch}
.col{flex:0 0 288px;display:flex;flex-direction:column;background:var(--col);border-radius:12px;min-height:0;max-height:100%}
.col.drop{outline:2px dashed var(--red);outline-offset:-4px}
.colh{padding:10px 12px 8px;border-top:4px solid var(--grey);border-radius:12px 12px 0 0}
.colh b{display:block;font-size:14px}
.colh span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cards{flex:1;overflow-y:auto;padding:4px 8px 10px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--panel);border-radius:9px;padding:10px 11px;box-shadow:var(--shadow);cursor:pointer;border:1px solid transparent;display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:var(--line)}
.card.sel{border-color:var(--red)}
.card .nm{font-weight:700;line-height:1.25}
.card .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.card .val{font-weight:700;font-size:15px;color:var(--fg);font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700;border:1px solid currentColor;white-space:nowrap}
.tag.s{color:#fff!important}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.more{border:none;background:none;color:var(--red);cursor:pointer;padding:6px;font-weight:700}
.empty{color:var(--muted);font-size:12px;padding:10px;text-align:center}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--panel);z-index:21;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.15);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dh{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dh h2{margin:0;font-size:18px;line-height:1.25}
.x{margin-left:auto;border:none;background:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
.db{flex:1;overflow-y:auto;padding:14px 18px 24px;display:flex;flex-direction:column;gap:18px}
.db h3{margin:0 0 8px;font-size:14px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kv div{background:var(--bg);border-radius:8px;padding:8px 10px;border-left:3px solid var(--line)}
.kv span{display:block;font-size:11px;color:var(--muted)}
.kv b{font-variant-numeric:tabular-nums}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select.inp,input.inp,textarea.inp{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
textarea.inp{width:100%;min-height:70px;resize:vertical}
.btn{border:none;border-radius:8px;padding:8px 13px;font-weight:700;cursor:pointer;background:var(--red);color:#fff;white-space:nowrap}
.btn:hover{background:var(--red-dk)}
.btn.g{background:var(--panel);color:var(--fg);border:1px solid var(--line)}
.btn.g:hover{border-color:var(--red);color:var(--red)}
.btn[disabled]{opacity:.45;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 10px;cursor:pointer;font-size:12px}
.chip[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
.grp{font-size:11px;color:var(--muted);margin:8px 0 4px}
table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
th{text-align:left;color:var(--muted);font-weight:700;padding:5px 6px;border-bottom:1px solid var(--line)}
td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
.tw{overflow-x:auto}
.tl{display:flex;flex-direction:column}
.ev{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.ev .ic{width:28px;height:28px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;background:var(--bg)}
.ev .bd{flex:1;min-width:0}
.ev .meta{font-size:11px;color:var(--muted)}
.form{background:var(--bg);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.form .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.picker{position:relative}
.plist{position:absolute;z-index:5;top:100%;left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);max-height:240px;overflow:auto}
.plist button{display:flex;gap:8px;align-items:center;width:100%;border:none;background:none;padding:7px 9px;cursor:pointer;text-align:left}
.plist button:hover{background:var(--bg)}
/* agenda / indicadores / config */
.page{flex:1;overflow-y:auto;padding:4px 18px 24px}
.agrp{margin-top:14px}
.agrp h3{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px}
.alist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:8px}
.kpi{background:var(--panel);border-radius:10px;padding:12px;box-shadow:var(--shadow);border-left:4px solid var(--grey)}
.kpi span{font-size:12px;color:var(--muted)}
.kpi b{display:block;font-size:20px;margin-top:4px;font-variant-numeric:tabular-nums}
.box{background:var(--panel);border-radius:10px;padding:14px;box-shadow:var(--shadow);margin-top:12px}
.lst{display:flex;flex-direction:column;gap:6px}
.lst .it{display:flex;gap:8px;align-items:center}
.lst input[type=text]{flex:1;min-width:0}

.modal-scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow-y:auto}
.modal{background:var(--panel);border-radius:14px;width:min(620px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column}
.modal .mh{display:flex;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal .mh h2{margin:0;font-size:17px}
.modal .mb{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.fld .req{color:var(--red)}
.fld .inp{color:var(--fg);font-size:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.err{color:var(--red);font-size:12px}
.ms{position:relative}
.ms-btn{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer}
.ms-pop{position:absolute;z-index:40;top:calc(100% + 4px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.15);max-height:320px;overflow:auto;padding:6px}
.ms-pop .g{font-size:11px;color:var(--muted);padding:8px 6px 2px;font-weight:700}
.ms-pop label{display:flex;gap:8px;align-items:flex-start;padding:6px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--fg)}
.ms-pop label:hover{background:var(--bg)}
.ms-pop input{accent-color:var(--red);margin-top:2px}
.ms-sel{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ms-sel .chip{background:color-mix(in srgb,var(--red) 10%,var(--panel));border-color:color-mix(in srgb,var(--red) 40%,var(--line));display:inline-flex;gap:6px;align-items:center;cursor:default}
.ms-sel .chip button{border:none;background:none;cursor:pointer;color:var(--red);font-size:14px;line-height:1;padding:0}
.sec{border:1px solid var(--line);border-radius:10px}
.sec>summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;gap:10px;align-items:center;font-weight:700}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary .car{color:var(--red);transition:transform .15s;display:inline-block}
.sec[open]>summary .car{transform:rotate(90deg)}
.sec>summary .sm{margin-left:auto;font-weight:400;font-size:12px;color:var(--muted)}
.sec .in{padding:0 12px 12px}
.pg{border-top:1px solid var(--line)}
.pg>button{all:unset;cursor:pointer;display:grid;grid-template-columns:16px 1fr auto;gap:8px;align-items:center;width:100%;padding:8px 2px;font-size:13px}
.pg>button .car{color:var(--red);transition:transform .15s}
.pg>button[aria-expanded=true] .car{transform:rotate(90deg)}
.pg>button small{display:block;color:var(--muted);font-size:11px}
.pg>button b{font-variant-numeric:tabular-nums}
.selbar{position:sticky;bottom:0;z-index:15;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 18px;background:var(--panel);border-top:2px solid var(--red);box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.selbar .inp{max-width:240px}
.cbx{accent-color:var(--red);width:16px;height:16px;margin:0;cursor:pointer;flex:none}
.card.picked{border-color:var(--red);background:color-mix(in srgb,var(--red) 6%,var(--panel))}
.colh .all{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:6px;cursor:pointer}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;flex:1;min-width:120px}
.prog i{display:block;height:100%;background:var(--red);width:0}
.tbl-wrap{overflow-x:auto}
.tbl-wrap table td,.tbl-wrap table th{white-space:nowrap}
.tbl-wrap table td.w{white-space:normal;min-width:200px}
@media (max-width:640px){.col{flex-basis:84vw}.topin{padding:10px 12px}.filters,.board,.page{padding-left:12px;padding-right:12px}}
@media (prefers-reduced-motion:no-preference){.drawer{animation:sl .18s ease-out}@keyframes sl{from{transform:translateX(24px);opacity:.6}}}
</style>
</head>
<body>
<header class="top">
  <div class="bars"><i></i><i></i></div>
  <div class="topin">
    <div class="brand"><b>Cobrança</b><span>Fucape Business School · quadro da equipe</span></div>
    <div class="views" role="tablist" aria-label="Visões">
      <button type="button" data-v="rec" aria-pressed="false">Recebíveis</button>
      <button type="button" data-v="quadro" aria-pressed="true">Quadro</button>
      <button type="button" data-v="agenda" aria-pressed="false">Minha agenda</button>
      <button type="button" data-v="equipe" aria-pressed="false">Equipe</button>
      <button type="button" data-v="ind" aria-pressed="false">Indicadores</button>
      <button type="button" data-v="cfg" aria-pressed="false" id="vcfg">Configurações</button>
    </div>
    <div class="me" id="me"></div>
  </div>
</header>
<div class="filters" id="filters">
  <input type="search" id="q" placeholder="Buscar responsável, aluno ou curso…" aria-label="Buscar">
  <div class="seg" id="fown" role="group" aria-label="Responsável pela cobrança">
    <button type="button" data-o="" aria-pressed="true">Todos</button>
    <button type="button" data-o="me" aria-pressed="false">Meus</button>
    <button type="button" data-o="none" aria-pressed="false">Sem dono</button>
  </div>
  <select id="fcurso" aria-label="Curso"><option value="">Todos os cursos</option></select>
  <select id="fsla" aria-label="Prazo"><option value="">Qualquer prazo</option><option value="late">Ação atrasada</option><option value="today">Ação para hoje</option><option value="none">Sem próxima ação</option></select>
  <button type="button" class="btn g" id="bsel" aria-pressed="false">Selecionar em lote</button>
  <span class="note" id="fcount"></span>
</div>
<div id="banners"></div>
<main id="main"></main>
<div id="recwrap" style="display:none;flex:1;min-height:0;flex-direction:column"></div>
<div class="selbar" id="selbar" hidden></div>
<template id="rec-tpl"><style>
.fc{--fc-red:#E52329;--fc-red-dk:#9C1E21;--fc-logo:#d62717;--fc-amber:#D98C1F;font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;color:var(--color-fg);display:flex;flex-direction:column;gap:var(--cds-gap-lg)}
.fc h2{font-size:var(--cds-font-size-heading);font-weight:700;margin:0;letter-spacing:-.01em}
.fc h2::before{content:"";display:inline-block;width:4px;height:.9em;background:var(--fc-red);margin-right:8px;vertical-align:-1px;border-radius:1px}
.fc .note{color:var(--color-fg-muted);font-size:var(--cds-font-size-caption);margin:4px 0 0;line-height:1.45}
.fc-hero{display:flex;align-items:stretch;background:var(--color-panel);border:1px solid var(--color-border-line);border-radius:var(--cds-radius);overflow:hidden}
.fc-bars{display:flex;flex:none}
.fc-bars i{display:block}
.fc-bars i:first-child{width:10px;background:var(--fc-red-dk)}
.fc-bars i:last-child{width:24px;background:var(--fc-red)}
.fc-hero-body{flex:1;min-width:0;padding:var(--cds-pad-lg) var(--cds-pad-xl);display:flex;gap:var(--cds-gap-lg);align-items:center;flex-wrap:wrap}
.fc-brand{display:flex;align-items:center;gap:12px;padding-right:var(--cds-gap-lg);border-right:1px solid var(--color-border-line);color:var(--color-fg-muted)}
.fc-brand svg{width:46px;height:46px;flex:none}
.fc-brand .tag{font-size:var(--cds-font-size-caption);line-height:1.15}
.fc-brand .tag b{display:block;color:var(--color-fg);font-size:var(--cds-font-size-body);letter-spacing:.04em}
.fc-titlebox{flex:1;min-width:min(100%,20rem)}
.fc h1{font-size:var(--cds-font-size-title);font-weight:700;margin:0;letter-spacing:-.01em}
.fc .lede{margin:8px 0 0;max-width:72rem;line-height:1.55}
.fc .lede b{font-weight:700;color:var(--fc-red)}
.fc .filters{display:flex;flex-wrap:wrap;gap:var(--cds-gap-md);align-items:flex-end;background:var(--color-panel);border:1px solid var(--color-border-line);border-radius:var(--cds-radius);padding:var(--cds-pad-md) var(--cds-pad-lg)}
.fc .fld{display:flex;flex-direction:column;gap:4px;font-size:var(--cds-font-size-caption);color:var(--color-fg-muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.fc select,.fc input[type=search]{font:inherit;font-size:var(--cds-font-size-body);text-transform:none;letter-spacing:0;font-weight:400;padding:7px 10px;border:1px solid var(--color-border-line);border-radius:var(--cds-radius);background:var(--color-bg);color:var(--color-fg);min-width:11rem}
.fc select:focus,.fc input:focus{outline:2px solid var(--fc-red);outline-offset:1px}
.fc .seg{display:flex;flex-wrap:wrap;gap:4px}
.fc .seg button{font:inherit;font-size:var(--cds-font-size-body);text-transform:none;letter-spacing:0;font-weight:400;border:1px solid var(--color-border-line);background:var(--color-bg);color:var(--color-fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.fc .seg button[aria-pressed=true]{background:var(--fc-red);border-color:var(--fc-red);color:#fff;font-weight:700}
.fc .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,13rem),1fr));gap:var(--cds-gap-md)}
.fc .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,24rem),1fr));gap:var(--cds-gap-md)}
.fc .card{background:var(--color-panel);border:1px solid var(--color-border-line);border-radius:var(--cds-radius);padding:var(--cds-pad-lg);min-width:0}
.fc .kpi{border-top:4px solid var(--color-border-line)}
.fc .kpi.r1{border-top-color:var(--fc-red)} .fc .kpi.r2{border-top-color:var(--fc-red-dk)} .fc .kpi.am{border-top-color:var(--fc-amber)}
.fc .kpi .lbl{font-size:var(--cds-font-size-caption);color:var(--color-fg-muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.fc .kpi .val{font-size:var(--cds-font-size-title);font-weight:700;font-variant-numeric:tabular-nums;margin:6px 0 2px;line-height:1.15}
.fc .kpi .sub{font-size:var(--cds-font-size-caption);color:var(--color-fg-muted)}
.fc .hbars{display:flex;flex-direction:column;gap:6px;margin-top:var(--cds-gap-md);min-height:8rem}
.fc .hb{display:grid;grid-template-columns:minmax(8rem,14rem) 1fr auto;gap:10px;align-items:center;font-size:var(--cds-font-size-caption);cursor:pointer;border-radius:6px;padding:3px 6px}

  <section class="card method" id="metodologia">
    <details>
      <summary>Como cada título foi classificado</summary>
      <p>Cada título da aba BD foi lido pelo status no RM, pelo status CNAB do arquivo de retorno, pelo código de retorno do banco e pelo valor efetivamente baixado.</p>
      <ul>
        <li><b>Pago via boleto</b>: baixado com valor e retorno <code>06</code> (liquidação bancária).</li>
        <li><b>Pago fora do boleto (PIX)</b>: baixado com valor e retorno <code>10</code> (boleto baixado por instrução), ou CNAB “Não Remetido” com valor recebido (aluno nunca teve boleto e pagou por PIX/depósito).</li>
        <li><b>Baixado sem entrada financeira</b>: status “Baixado” com valor recebido zero. Se a baixa foi muito antes do vencimento, recebe alerta de provável cancelamento lançado como baixa (caso Adão Ferreira da Silva).</li>
        <li><b>Cobrar</b>: vencido com boleto registrado no banco — recebeu e não pagou.</li>
        <li><b>Emitir boleto e cobrar</b>: vencido com CNAB “Não Remetido” ou “Recusado” — não recebeu boleto.</li>
        <li><b>Validar</b>: em aberto com boleto já baixado no banco (retorno <code>10</code>, provável PIX não conciliado), ou duplicidade no mesmo mês de vencimento, tipo de cobrança e valor. Fica fora do “a cobrar”.</li>
        <li><b>Acordos</b> vêm da coluna Situação da Parcela: “ENV. CAPER” = enviado à Caper (cobrança externa); “EM ABERTO REN. CAPER/PRETTI” = parcela de acordo das assessorias (acompanhar, não cobrar direto); “AJUIZADO” = jurídico; “ACORDO” = acordo interno (cobrar normalmente, mas vencida indica acordo descumprido); “RENEGOCIADO” = parcela original substituída pelo acordo (não é baixa irregular). Esses valores saem do “a cobrar”.</li>
        <li><b>Competência</b> no resumo executivo é o mês de vencimento da parcela original — o campo “Mês de Competência” do RM vem com a data da migração (02/11/2025) em boa parte dos títulos do Athenas. A ligação acordo → competência sai do histórico do acordo (“REF. VENCTO 10/04/2026”, “VENCTOS 05 E 06/2026”, “Ref. Parcela Nº 5”, “JUNHO/2025 A NOVEMBRO/2025”); quando o histórico não cita, a parcela aparece só na lista de parcelas de acordo.</li>

  async function emLote(keys, patch, titulo) {

    const worker = async () => {
      while (fila.length) {
        const key = fila.shift();
        const d = baseDoc(key);
        const ev = 'owner' in patch ? { tipo: 'atribuicao', de: d.owner || null, para: patch.owner, lote } : { tipo: 'status', de: d.status, para: patch.status, lote };
        if (('owner' in patch && d.owner === patch.owner) || ('status' in patch && d.status === patch.status)) { feito++; continue; }

  }

      resolveNames([...cardDocs.values()].map((d) => d.owner)).then(() => render());
      render(); refreshDrawer();
    }, (e) => { if (e.code === 'revoked') { canWrite = false; banners(); } });
    db.collection('eventos').orderBy('at', 'desc').limit(1000).onSnapshot((s) => { EVENTS = s.docs.map((d) => d.data()).filter((e) => e && e.card && e.at); render(); refreshDrawer(); }, () => {});
    db.collection('ajustes').onSnapshot((s) => { AJ = new Map(s.docs.map((d) => [d.id, d.data()]).filter((x) => x[1] && !x[1].removido)); render(); refreshDrawer(); }, () => {});
    db.collection('inclusoes').onSnapshot((s) => { INC = s.docs.map((d) => Object.assign({ _id: d.id }, d.data())).filter((x) => !x.removida); render(); refreshDrawer(); }, () => {});
    db.collection('alocacoes').orderBy('at', 'desc').limit(1000).onSnapshot((s) => { ALOC = s.docs.map((d) => d.data()).filter((e) => e && e.card && e.at); if (st.view === 'equipe') render(); refreshDrawer(); }, () => {});
  }
  boot();
})();
</script>
